services:
  - type: web
    name: bridge-design-tool
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python -m streamlit run "$(ls 0_*_Home.py)"
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
